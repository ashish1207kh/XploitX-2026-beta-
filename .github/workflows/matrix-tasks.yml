name: Matrix Tasks Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ──────────────── BUILD ────────────────

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: |
          npm install --prefix backend

      - name: Package for Deployment
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifact
          path: |
            .
            !**/.git/**
            !**/.github/**
            !**/*.env
            !**/*.db
            !**/*.log
            !data.json
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-artifact
          path: deploy-artifact

      - name: Create Tarball for Transfer
        run: |
          cd deploy-artifact
          tar -czf ../deploy.tar.gz .

      # ──────────────── TRANSFER ────────────────

      - name: Transfer to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: deploy.tar.gz
          target: /tmp/

      # ──────────────── DEPLOY ────────────────

      - name: "SSH: Cleanup Existing Processes"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            # Kill existing processes on specific ports gracefully
            PIDS=$(lsof -t -i :3000 2>/dev/null || true)
            if [ -n "$PIDS" ]; then 
              kill -9 $PIDS || true
            fi
            
            # Use a more targeted kill instead of global 'pkill node'
            # Or run it with nohup so it doesn't terminate the SSH action wrapper
            killall -q -9 node || true
            sleep 1

      - name: "SSH: Deploy Application"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            # Backup .env and .db files
            mkdir -p /tmp/app-backup
            find ~/app -name '*.env' -exec cp --parents {} /tmp/app-backup/ \; 2>/dev/null || true
            find ~/app -name '*.db' -exec cp --parents {} /tmp/app-backup/ \; 2>/dev/null || true

            # Extract new code
            rm -rf ~/app/*
            tar -xzf /tmp/deploy.tar.gz -C ~/app

            # Restore .env and .db files
            if [ -d /tmp/app-backup/root/app ]; then
              cp -rf /tmp/app-backup/root/app/. ~/app/
            fi
            rm -rf /tmp/deploy.tar.gz

            # Fix native module architecture mismatch
            cd ~/app/backend && npm rebuild

            # Start services
            cd ~/app/backend
            setsid npm start > ~/app.log 2>&1 &

            sleep 2

      - name: "SSH: Health Verification"
        uses: appleboy/ssh-action@v1.2.0
        with:
          command_timeout: 15m
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd ~/app
            # Wait for servers to initialize
            sleep 15

            # Define a function to print logs on failure
            check_port() {
              if ! curl -s -I http://localhost:$1 >/dev/null; then
                echo "❌ Failed to connect to port $1!"
                echo "--- BACKEND LOG (app.log) ---"
                tail -n 50 ~/app.log || true
                exit 1
              fi
            }

            # Health check for backend port
            check_port 3000

            echo "SUCCESS: Backend operational on port 3000."

