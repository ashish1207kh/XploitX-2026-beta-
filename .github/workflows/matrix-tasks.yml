name: Matrix Tasks Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-matrix-tasks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy and Verify via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd ~/app
            git pull origin main
            
            # Install dependencies
            npm install --prefix backend
            npm install --prefix digitial/Matrix-tasks
            npm run install-tasks --prefix digitial/Matrix-tasks
            
            # Kill existing processes
            kill -9 $(lsof -t -i :3000-3006) || true
            pkill -f node || true

            # Start Backend and Matrix Tasks
            nohup npm start --prefix backend > app.log 2>&1 &
            nohup npm run start-tasks --prefix digitial/Matrix-tasks > app1.log 2>&1 &
            
            # Wait for servers to initialize
            sleep 15
            
            # Health check for all ports
            curl -I http://localhost:3000 || exit 1
            curl -I http://localhost:3001 || exit 1
            curl -I http://localhost:3002 || exit 1
            curl -I http://localhost:3003 || exit 1
            curl -I http://localhost:3004 || exit 1
            curl -I http://localhost:3005 || exit 1
            curl -I http://localhost:3006 || exit 1
            
            echo "SUCCESS: All systems operational on designated ports."
