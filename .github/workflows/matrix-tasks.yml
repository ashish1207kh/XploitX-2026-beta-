name: Matrix Tasks Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-matrix-tasks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (Backend)
        run: npm install --prefix backend

      - name: Install dependencies (Matrix Tasks Manager)
        run: npm install --prefix digitial/Matrix-tasks

      - name: Install dependencies (All Individual Tasks)
        run: npm run install-tasks --prefix digitial/Matrix-tasks

      - name: Verify All Tasks Start
        run: |
          # Start Backend in background
          npm start --prefix backend &
          
          # Start All Matrix Tasks in background
          npm run start-tasks --prefix digitial/Matrix-tasks &
          
          # Wait for servers to initialize
          sleep 15
          
          # Health check for all ports
          curl -I http://localhost:3000 || exit 1
          curl -I http://localhost:3001 || exit 1
          curl -I http://localhost:3002 || exit 1
          curl -I http://localhost:3003 || exit 1
          curl -I http://localhost:3004 || exit 1
          curl -I http://localhost:3005 || exit 1
          curl -I http://localhost:3006 || exit 1
          
          echo "SUCCESS: All systems operational on designated ports."

